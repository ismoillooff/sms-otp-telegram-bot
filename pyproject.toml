[project]
name = "sms-otp-telegram-bot"
version = "1.0.0"
description = "Telegram bot that verifies phone numbers with SMS one-time codes (SMSXabarnoma.uz)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
